name: Backend CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Lint, Type-check, Migrate, and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lexaware
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: lexaware
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # MinIO is started as a step-level container because the service
      # container declaration doesn't support inline command/entrypoint
      # with the standard syntax needed for the MinIO server start-up flag.
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=lexaware \
            -e MINIO_ROOT_PASSWORD=changememinio \
            minio/minio server /data
          for i in $(seq 1 15); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done

      - name: Create private document bucket
        run: |
          docker run --rm --network host \
            minio/mc alias set ci http://localhost:9000 lexaware changememinio
          docker run --rm --network host \
            minio/mc mb ci/lexaware-documents-private

      # ClamAV - start, then wait for it to finish loading signatures.
      # Signature loading can take 60+ seconds on a fresh image.
      - name: Start ClamAV
        run: |
          docker run -d --name clamav \
            -p 3310:3310 \
            clamav/clamav:1.4
          echo "Waiting for ClamAV to load signatures..."
          for i in $(seq 1 40); do
            if docker exec clamav clamdscan --ping 2>/dev/null | grep -q PONG; then
              echo "ClamAV ready after $((i*5))s"; break
            fi
            sleep 5
          done

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install Python dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff - lint
        working-directory: apps/api
        run: ruff check .

      - name: Ruff - format check
        working-directory: apps/api
        run: ruff format --check .

      - name: mypy - strict type check
        working-directory: apps/api
        run: mypy app

      - name: Alembic - upgrade head
        working-directory: apps/api
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5434"
          POSTGRES_USER: lexaware
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: lexaware
        run: alembic upgrade head

      - name: Alembic - check no migration drift
        working-directory: apps/api
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5434"
          POSTGRES_USER: lexaware
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: lexaware
        run: alembic check

      - name: pytest - full test suite
        working-directory: apps/api
        env:
          ENVIRONMENT: ci
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5434"
          POSTGRES_USER: lexaware
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: lexaware
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: lexaware
          S3_SECRET_KEY: changememinio
          S3_BUCKET: lexaware-documents-private
          S3_REGION: us-east-1
          CLAMAV_HOST: localhost
          CLAMAV_PORT: "3310"
          # AI providers remain disabled in CI; no live provider keys are needed.
          AI_PROVIDER: disabled
          EMBEDDING_PROVIDER: disabled
        run: pytest
