<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="description" content="Clear, student-focused legal awareness and practical next steps." />
    <link rel="icon" type="image/svg+xml" href="./src/favicon.svg" />
    <title>LexAware Student — Know your rights</title>
    <script>
      (() => {
        try {
          const preference = localStorage.getItem("lexaware-theme");
          const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = preference === "light" || preference === "dark"
            ? preference
            : systemDark ? "dark" : "light";
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
