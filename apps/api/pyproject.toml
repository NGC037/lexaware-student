[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "lexaware-student-api"
version = "0.1.0"
description = "Backend API for the LexAware Student platform."
readme = "README.md"
requires-python = ">=3.14,<3.15"

dependencies = [
    "fastapi>=0.118,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.15,<2.0",
    "redis>=6.0,<7.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.11,<1.0",
    "mypy>=1.15,<2.0",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"


[tool.ruff]
line-length = 100
target-version = "py314"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]


[tool.mypy]
python_version = "3.14"
strict = true