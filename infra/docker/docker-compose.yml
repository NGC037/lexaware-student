name: lexaware-student

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lexaware-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lexaware}
      POSTGRES_USER: ${POSTGRES_USER:-lexaware}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-lexaware} -d ${POSTGRES_DB:-lexaware}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - lexaware

  redis:
    image: redis:7-alpine
    container_name: lexaware-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - lexaware

  minio:
    image: minio/minio:latest
    container_name: lexaware-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lexaware}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}

    ports:
      - "${S3_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - lexaware

  minio-init:
    image: minio/mc:latest
    container_name: lexaware-minio-init

    depends_on:
      minio:
        condition: service_healthy

    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000
      $${MINIO_ROOT_USER}
      $${MINIO_ROOT_PASSWORD}
      &&
      mc mb --ignore-existing local/$${S3_BUCKET:-lexaware-documents-private}
      &&
      mc anonymous set none local/$${S3_BUCKET:-lexaware-documents-private}
      "

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lexaware}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
      S3_BUCKET: ${S3_BUCKET:-lexaware-documents-private}

    networks:
      - lexaware

  clamav:
    image: clamav/clamav:1.4.6
    container_name: lexaware-clamav
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav

    # Loopback only for host-run integration tests; never bind on public interfaces.
    ports:
      - "127.0.0.1:3310:3310"

    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=3 --no-summary /etc/hostname >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    networks:
      - lexaware

  document-worker:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: lexaware-document-worker
    restart: unless-stopped

    command: ["python", "-m", "app.workers.document_worker"]

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lexaware}
      POSTGRES_USER: ${POSTGRES_USER:-lexaware}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-lexaware}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-minio}
      S3_BUCKET: ${S3_BUCKET:-lexaware-documents-private}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310

    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy

    networks:
      - lexaware

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:

networks:
  lexaware:
    name: lexaware-network
    driver: bridge
